name: guard
# Static checks. No network, no deploy wait — these gate the push itself.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Action contract
        run: node scripts/check-actions.mjs
      - name: Registration guard
        run: node scripts/check-registration.mjs
