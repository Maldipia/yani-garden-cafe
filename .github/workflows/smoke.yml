name: smoke
# Runs the read-only regression suite after every push to main. The suite makes
# no writes, so it is safe to point at production — which is the only
# environment that exists.
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Wait for Vercel to finish deploying
        run: sleep 60
      - name: Regression suite
        run: node tests/smoke.mjs
